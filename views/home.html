{{define "home"}}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{.title}}</title>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/alpinejs/3.13.3/cdn.js"></script>
  <link rel="stylesheet" href="assets/styles.css">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16x16.png">
  <link rel="manifest" href="/assets/site.webmanifest">
</head>
<body>
  <div class="container" x-data="bookstore()">
    <header>
      <div class="header-content">
        <h1>📚 {{.appName}}</h1>
        <p>{{.headline}}</p>
      </div>
      
      <div class="session-stats">
        <div class="session-stat">
          <div class="session-stat-value">
            <span :class="sseConnected ? 'connection-status connected' : 'connection-status disconnected'"></span>
            <span x-text="activeConnections || '0'"></span>
          </div>
          <div class="session-stat-label">🟢 Active</div>
        </div>
        <div class="session-stat">
          <div class="session-stat-value">
            <span x-text="totalSessions || '0'"></span>
          </div>
          <div class="session-stat-label">📊 Total</div>
        </div>
      </div>
    </header>

    <div class="controls">
      <div class="search-bar">
        <input
          type="text"
          x-model="searchQuery"
          placeholder="Search by title or author..."
          @input.debounce.500ms="searchBooks"
        >
        <input
          type="number"
          x-model="bookId"
          placeholder="Enter Book ID"
          min="1"
        >
        <button class="btn-primary" @click="fetchAllBooks" :disabled="loading">
          📚 All Books
        </button>
        <button class="btn-secondary" @click="fetchBookById" :disabled="loading || !bookId">
          🔍 Find by ID
        </button>
      </div>
    </div>

    <div x-show="error" x-transition class="error" x-text="error"></div>

    <div x-show="!loading && books.length > 0" x-transition class="stats">
      <div class="stat">
        <div class="stat-value">
          <span x-text="books.length"></span>
        </div>
        <div class="stat-label">Total Books</div>
      </div>
      <div class="stat">
        <div class="stat-value" x-text="averagePrice"></div>
        <div class="stat-label">Average Price</div>
      </div>
      <div class="stat">
        <div class="stat-value">
          <span x-text="serverTime || '--:--:--'"></span>
        </div>
        <div class="stat-label">Server Time</div>
      </div>
      <div class="stat">
        <div class="stat-value">
          <span :class="sseConnected ? 'connection-status connected' : 'connection-status disconnected'"></span>
          <span x-text="connectedSince || '--:--:--'"></span>
        </div>
        <div class="stat-label">Connected Since</div>
      </div>
    </div>

    <div x-show="loading" x-transition class="loading">
      Loading books
    </div>

    <div x-show="!loading && books.length > 0" x-transition class="book-grid">
      <template x-for="book in books" :key="book.id">
        <div class="book-card">
          <div class="book-image">
            <img :src="book.imageLink" :alt="book.title" loading="lazy">
          </div>
          <div class="book-info">
            <h3 class="book-title" x-text="book.title"></h3>
            <p class="book-author" x-text="book.author"></p>
            <div class="book-meta">
              <span>📅 <span x-text="book.year"></span></span>
              <span>🌐 <span x-text="book.language"></span></span>
            </div>
            <div class="book-price" x-text="`$${book.price.toFixed(2)}`"></div>
          </div>
        </div>
      </template>
    </div>

    <div x-show="!loading && books.length === 0" x-transition class="empty-state">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
      </svg>
      <h3>No Books Found</h3>
      <p>Try adjusting your search or browse all books</p>
    </div>
  </div>

  <script>
    function bookstore() {
      return {
        books: [],
        loading: false,
        error: null,
        searchQuery: '',
        bookId: '',
        serverTime: '',
        connectedSince: '',
        activeConnections: 0,
        totalSessions: 0,
        sseConnected: false,
        eventSource: null,

        init() {
          this.fetchAllBooks();
          this.connectSSE();
        },

        connectSSE() {
          if (this.eventSource) {
            this.eventSource.close();
          }

          try {
            this.eventSource = new EventSource('/sse/sessions');
            
            this.eventSource.onopen = () => {
              this.sseConnected = true;
              console.log('✅ SSE connection established');
            };

            this.eventSource.onmessage = (event) => {
              try {
                const data = JSON.parse(event.data);
                this.serverTime = data.time;
                this.connectedSince = data.connectedSince;
                this.activeConnections = data.activeConnections || 0;
                this.totalSessions = data.totalSessions || 0;
              } catch (err) {
                console.error('Failed to parse SSE data:', err);
                this.serverTime = event.data;
              }
            };

            this.eventSource.onerror = (error) => {
              console.error('❌ SSE error:', error);
              this.sseConnected = false;
              this.eventSource.close();
              
              setTimeout(() => {
                if (!this.sseConnected) {
                  console.log('🔄 Attempting to reconnect SSE...');
                  this.connectSSE();
                }
              }, 5000);
            };
          } catch (err) {
            console.error('Failed to establish SSE connection:', err);
            this.sseConnected = false;
          }
        },

        destroy() {
          if (this.eventSource) {
            this.eventSource.close();
          }
        },

        async fetchAllBooks() {
          this.loading = true;
          this.error = null;
          this.searchQuery = '';
          this.bookId = '';

          try {
            const response = await fetch('/api/v1/books');
            
            if (!response.ok) {
              throw new Error(`Failed to fetch books (${response.status})`);
            }
            
            this.books = await response.json();
          } catch (err) {
            this.error = err.message || 'Failed to fetch books';
            this.books = [];
          } finally {
            this.loading = false;
          }
        },

        async fetchBookById() {
          if (!this.bookId) return;

          this.loading = true;
          this.error = null;

          try {
            const response = await fetch(`/api/v1/books/${this.bookId}`);
            
            if (!response.ok) {
              throw new Error(`Book with ID ${this.bookId} not found`);
            }
            
            const book = await response.json();
            this.books = [book];
            this.searchQuery = '';
          } catch (err) {
            this.error = err.message || 'Failed to fetch book';
            this.books = [];
          } finally {
            this.loading = false;
          }
        },

        async searchBooks() {
          if (!this.searchQuery.trim()) {
            this.fetchAllBooks();
            return;
          }

          this.loading = true;
          this.error = null;
          this.bookId = '';

          try {
            const response = await fetch(`/api/v1/books?q=${encodeURIComponent(this.searchQuery)}`);
            
            if (!response.ok) {
              throw new Error(`Search failed (${response.status})`);
            }
            
            this.books = await response.json();
          } catch (err) {
            this.error = err.message || 'Search failed';
            this.books = [];
          } finally {
            this.loading = false;
          }
        },

        get averagePrice() {
          if (this.books.length === 0) return '$0.00';
          const avg = this.books.reduce((sum, book) => sum + book.price, 0) / this.books.length;
          return `$${avg.toFixed(2)}`;
        }
      };
    }
  </script>
</body>
</html>
{{end}}
